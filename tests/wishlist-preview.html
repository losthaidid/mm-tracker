<body data-motion="calm"><p class="preview-note">Interactive example · sample records only · resets on reload · no account connection</p><div class="preview-shell"><header class="preview-header"><div class="preview-brand"><span class="preview-leaf" aria-hidden="true">❧</span><div><small>YOUR WORKHUB · A LITTLE MORE CLARITY</small><h1>A good place for good work.</h1></div></div><span class="eyebrow">YOUR WORDS. YOUR RHYTHM.</span></header><nav class="preview-nav" aria-label="Example workspace"><button data-demo="nav" data-tab="tickets" class="active">Tickets</button><button data-demo="nav" data-tab="snippets">Snippets</button><button data-demo="nav" data-tab="validator">Validation Studio</button><button data-wl="fields" class="preview-right">Field library</button></nav><div id="view"></div></div><p id="previewStatus" role="status"></p><dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button data-demo="close" aria-label="Close dialog">×</button></div><div id="modalBody"></div></dialog>
<script src="../vendor/jszip.min.js"></script><script src="../validator-engine.js?v=20261017-wishlist-1"></script><script src="../validator-files.js?v=20261017-wishlist-1"></script><script src="../validator-studio.js?v=20261017-wishlist-1"></script><script src="../batch-a-engine.js"></script><script src="../batch-a.js"></script><script src="../work-library-engine.js?v=20261017-wishlist-1"></script><script src="../work-library.js?v=20261017-wishlist-1"></script><script src="../ticket-workspace.js?v=20261017-wishlist-1"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),E=WorkHubWorkLibraryEngine,V=WorkHubValidatorEngine,B=WorkHubBatchEngine,T=WorkHubTicketWorkspace,esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const steps=['Analysing/Designing','Functional Spec','Sr Review','ABAP Estimation','ADL Approval Dev','ABAP Dev','ABAP Fixing','Unit Testing','UAT','External Approval','BASIS','FMP'];
const statuses=['Pending','In Progress','On Hold','Completed','Closed'];
const ticket=(id,number,description,priority,pic,status,history)=>({id,ticket:number,description,priority,pic,status,history,created:'2026-10-01',historyDate:'2026-10-16',historyTime:'14:30',jira:'AMS-SUPPORT',object:'Internal',action:'Configuration',transport:'FMD',type:'Support',mandays:2});
let d={tickets:[ticket('ticket-a','AMS-2048','Keep plant assignments consistent','High','Aisha','In Progress','- Scope confirmed with the process owner [15-10-2026]\n- UAT data is ready. Waiting for the key user to confirm a testing slot. [16-10-2026]'),ticket('ticket-b','AMS-2051','A clearer purchase order output','Medium','Daniel','Pending','- Output sample reviewed with the business. Prepare the revised layout for approval. [16-10-2026]'),ticket('ticket-c','AMS-2057','Resolve a blocked goods receipt','Critical','Haidid','On Hold','- Test reproduction is complete. Basis team is checking the background job. [16-10-2026]')],trackers:[],tasks:[],specs:[],projects:[],schedule:[],lists:{milestones:steps},workhub:{notes:[],sessions:[],ticketClosures:[]}},tab='tickets',library,validator,batch;
B.upgrade(d);E.upgrade(d);V.upgrade(d);d.trackers=d.tickets.map((t,i)=>({id:'p'+i,ticket:t.ticket,steps:steps.map((_,j)=>j<(i===0?8:i===1?3:5)),onHold:i===2,remarks:''}));
for(const t of d.tickets){const m=B.touch(d,'tickets',t.id);m.environmentId='qas';m.systemId='S4Q';m.client='200';}
d.workhub.workLibrary.bundles=[{id:'testing',name:'Testing coordination'},{id:'delivery',name:'Delivery updates'}];
const snippet=(id,title,category,bundleId,body)=>({id,title,category,bundleId,body,createdAt:'2026-10-16T06:00:00Z',updatedAt:'2026-10-16T06:00:00Z'});
d.workhub.workLibrary.snippets=[snippet('ready','Ready for your testing','UAT','testing','Hi {name},\n\nThe change for {ticket} is ready for testing in {system}, client {client}.\nPlease test {scenario} and share your results by {date}.\n\nThank you.'),snippet('follow','A gentle follow-up','Follow-up','testing','Hi {name},\n\nA quick follow-up on {ticket}. Is there anything you need from me to complete {next_step}?\n\nThank you.'),snippet('delivered','Delivery confirmation','Handover','delivery','Hi {name},\n\nThe change for {ticket} has been delivered in {system}.\nTransport: {transport}\n\nPlease let me know if you need any further support.')];
d.workhub.workLibrary.fields=[{id:'plant-field',name:'Plant code',definition:{...V.column(),key:'PLANT',label:'Plant',required:true,maxLength:'4',values:'0001,0002',description:'Use the four-character plant code, including leading zeros.'},updatedAt:'2026-10-16T06:00:00Z'}];
d.workhub.sessions=[{id:'s1',kind:'ticket',linkId:'ticket-a',title:'Prepare UAT data',start:'2026-10-16T06:00:00Z',end:'2026-10-16T07:15:00Z',seconds:4500,completedWork:'Prepared the approved testing scenarios.',nextStep:'Confirm a slot with the key user',notes:''}];
const template=V.create('Plant & storage assignments');template.description='Check the complete assignment and read the meaning beside each code.';template.columns=[{...V.column(0),key:'PLANT',label:'Plant',required:true},{...V.column(1),key:'SLOC',label:'Storage location',required:true}];template.lookups=[{id:'storage',name:'Storage assignments',headers:['Plant','Storage','Name','Purpose'],rows:[['0001','A1','Main warehouse','Standard inventory'],['0002','B1','Returns stock','Customer returns']],codeColumn:'Storage',nameColumn:'Name',descriptionColumns:['Purpose']}];const rule=V.rule('SLOC');rule.name='Allowed plant and storage';rule.assertion={...V.condition('SLOC'),operator:'lookupTuple',lookupId:'storage',pairs:[{field:'PLANT',referenceColumn:'Plant'},{field:'SLOC',referenceColumn:'Storage'}]};rule.message='This plant and storage location must belong to the same reference assignment.';template.rules=[rule];d.workhub.validator.templates=[template];
const tell=message=>$('previewStatus').textContent=message,closeModal=()=>$('modal').close(),latest=t=>t.history.split('\n').filter(Boolean).at(-1)||'',tag=s=>'<span class="tag">'+esc(s)+'</span>',opts=(xs,v)=>xs.map(x=>'<option'+(v===x?' selected':'')+'>'+esc(x)+'</option>').join('');
function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;batch?.decorateModal();library?.decorateModal();T.decorateEditor();$('modal').classList.toggle('ticket-dialog',!!$('modalBody').querySelector('[data-ticket-detail],.ticket-editor'));if(!$('modal').open)$('modal').showModal();}
function mutate(fn){try{const next=E.copy(d);fn(next);V.prepare(next,d);B.prepare(next,d);E.prepare(next,d);B.validate(next);E.validate(next);V.validateState(next);d=next;render();return true;}catch(e){tell(e.message);return false;}}
const adapter={state:()=>d,ready:()=>true,owner:()=>'example',mutate,tell,render,openModal,closeModal,navigate:v=>{tab=v;render();},today:()=>new Date().toISOString().slice(0,10),latestHistory:latest,ticket:id=>showTicket(id),project:()=>{},hubAction:()=>{}};
batch=WorkHubBatchA.install(adapter);library=WorkHubWorkLibrary.install(adapter);validator=WorkHubValidatorStudio.install({...adapter,fieldLibrary:(source,insert)=>library.openFields(source,insert),download(data,name,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}});
function render(){document.querySelectorAll('.preview-nav [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='snippets')$('view').innerHTML=library.render();else if(tab==='validator')$('view').innerHTML=validator.render();else $('view').innerHTML='<div class="preview-ticket-heading"><div><span class="eyebrow">TICKET WORKSPACE</span><h2>A clearer view of your support queue.</h2><p>Priorities, progress and the latest chapter — all in one place.</p></div><span class="tag">3 sample tickets</span></div><div class="ticket-board">'+d.tickets.map(t=>{const p=d.trackers.find(p=>p.ticket===t.ticket);return T.card(t,{complete:p.steps.filter(Boolean).length,total:steps.length,priorityClass:t.priority.toLowerCase(),priorityTag:tag(t.priority),statusOptions:opts(statuses,t.status),latest:latest(t),checked:'Checked 16 Oct'});}).join('')+'</div>';library.mount();}
function milestone(p){return'<section class="ticket-milestones"><div class="actions"><label class="check-label"><input type="checkbox" data-progress="'+p.id+'" data-step="all"'+(p.steps.every(Boolean)?' checked':'')+'>Select all (complete ticket)</label><label class="check-label"><input type="checkbox" data-progress="'+p.id+'" data-step="hold"'+(p.onHold?' checked':'')+'>On Hold</label></div><div class="milestones">'+steps.map((s,i)=>'<label><input type="checkbox" data-progress="'+p.id+'" data-step="'+i+'"'+(p.steps[i]?' checked':'')+'>'+s+'</label>').join('')+'</div></section>';}
function showTicket(id){const t=d.tickets.find(t=>t.id===id),p=d.trackers.find(p=>p.ticket===t.ticket);openModal(t.ticket,T.details(t,{complete:p.steps.filter(Boolean).length,total:steps.length,statusTag:tag(t.status),priorityTag:tag(t.priority),latest:latest(t),milestoneHtml:milestone(p),facts:[['JIRA / Charge Code',t.jira],['Created',t.created],['Priority',t.priority],['PIC',t.pic],['Status',t.status],['Object',t.object],['Action',t.action],['Latest Transport',t.transport],['Type',t.type],['Mandays Chargeable',t.mandays],['History changed',t.historyDate+' '+t.historyTime],['Last checked','16 Oct']]}));}
const editorFields=[['ticket','AMS Ticket'],['jira','JIRA / Charge code'],['created','Date created','date'],['description','Description','textarea'],['priority','Priority',['Critical','High','Medium','Low']],['pic','PIC'],['status','Status',statuses],['object','Object',['Internal','External']],['action','Action'],['transport','Latest transport'],['type','Type'],['mandays','Mandays chargeable','number'],['history','History tracker','textarea'],['historyDate','History date','date'],['historyTime','History time','time']];
function editTicket(id){const t=d.tickets.find(t=>t.id===id);openModal('Edit ticket','<form id="editForm" data-group="tickets" data-id="'+id+'"><div class="form-grid">'+editorFields.map(([k,l,type])=>'<div><label for="field-'+k+'">'+l+'</label>'+(Array.isArray(type)?'<select name="'+k+'" id="field-'+k+'">'+opts(type,t[k])+'</select>':type==='textarea'?'<textarea name="'+k+'" id="field-'+k+'">'+esc(t[k])+'</textarea>':'<input name="'+k+'" id="field-'+k+'" type="'+(type||'text')+'" value="'+esc(t[k])+'">')+'</div>').join('')+'</div><div class="modal-actions"><button type="button" data-demo="close">Cancel</button><button class="primary">Save ticket</button></div></form>');}
document.addEventListener('click',e=>{const demo=e.target.closest('[data-demo]');if(demo){if(demo.dataset.demo==='close')closeModal();else if(demo.dataset.demo==='nav'){tab=demo.dataset.tab;render();}return;}const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='detail')showTicket(b.dataset.id);if(b.dataset.action==='edit')editTicket(b.dataset.id);if(b.dataset.action==='check-ticket')tell('Sample ticket checked today.');});
document.addEventListener('change',e=>{const x=e.target;if(x.dataset.ticketStatus)mutate(n=>n.tickets.find(t=>t.id===x.dataset.ticketStatus).status=x.value);if(x.dataset.progress){const id=x.dataset.progress,step=x.dataset.step,checked=x.checked;if(mutate(n=>{const p=n.trackers.find(p=>p.id===id);if(step==='all')p.steps=p.steps.map(()=>checked);else if(step==='hold')p.onHold=checked;else p.steps[Number(step)]=checked;})){const p=d.trackers.find(p=>p.id===id);showTicket(d.tickets.find(t=>t.ticket===p.ticket).id);}}});
document.addEventListener('submit',e=>{const f=e.target;if(!['editForm','historyForm'].includes(f.id))return;e.preventDefault();if(f.id==='editForm'){const id=f.dataset.id;if(mutate(n=>{const t=n.tickets.find(t=>t.id===id),prior=t.ticket;for(const [k]of editorFields)t[k]=f.elements.namedItem(k).value;n.trackers.find(p=>p.ticket===prior).ticket=t.ticket;batch.capture(n,f,'tickets',id);}))closeModal();}else{const id=f.dataset.id,text=f.elements.namedItem('newHistory').value.trim();if(!text)return;if(mutate(n=>{const t=n.tickets.find(t=>t.id===id);t.history+='\n- '+text+' ['+new Date().toISOString().slice(0,10)+']';t.historyDate=new Date().toISOString().slice(0,10);}))showTicket(id);}});
render();
</script></body></html>
