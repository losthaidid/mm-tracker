*{box-sizing:border-box}body{margin:0;background:#edf1e7;color:#344b40;font:14px system-ui,sans-serif;padding:25px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d5dfd0;border-radius:10px;padding:8px 13px;background:#fffefa;color:#3e5e4f}button.primary{background:#397366;color:white;border-color:#397366}button.small{font-size:11px;padding:6px 9px}button:focus-visible{outline:3px solid #9ab79f;outline-offset:3px}[hidden]{display:none!important}.preview-note{font-size:11px;color:#6c7864;max-width:1380px;margin:0 auto 16px}.shell{max-width:1380px;margin:auto;border:1px solid #dce4d5;border-radius:25px;background:#fffefa;overflow:hidden;box-shadow:0 20px 65px #314c3908}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:25px 30px;background:linear-gradient(110deg,#f1f5e9,#f3effa);border-bottom:1px solid #dfe5d9}header h1{font:30px Georgia,serif;margin:7px 0 0;letter-spacing:-.04em}header .mark{display:flex;gap:15px;align-items:center}.leaf{display:grid;place-items:center;background:#e2ebd9;color:#668364;width:51px;height:51px;border-radius:18px;font-size:27px;box-shadow:0 5px 0 #dbe5d3}header small{color:#63765a;font-size:10px;letter-spacing:.13em;font-weight:700}nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 28px;border-bottom:1px solid #e1e7dc}nav button{border:0;background:transparent;color:#66745f}nav button.active{background:#e6eee0;color:#3c654e}#view{padding:25px 30px}.hub-head{margin:0 0 20px}.hub-head h2{font:29px Georgia,serif;color:#3f5b4b;margin:8px 0}.hub-head p{font-size:12px;color:#728068}.task-main-card,.hub-card{padding:22px;border:1px solid #e0e6db;border-radius:18px;background:#fffefa;margin-bottom:15px}.task-main-card h3{font-size:17px;margin:8px 0;color:#344e42}.task-main-card p{font-size:12px;line-height:1.75;color:#687965;white-space:pre-wrap}.task-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.task-top>span{font-size:10px;font-weight:700;letter-spacing:.1em;color:#7c876f}.tag{padding:4px 8px;border-radius:7px;background:#eef0e5;font-size:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.prewrap{white-space:pre-wrap}.hub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.hub-grid .hub-card{margin:0}.hub-card p{font-size:12px;color:#6a7964;line-height:1.8}.day-note{padding:24px;border:1px dashed #d8e1ce;border-radius:20px;background:#f6f8f0;color:#65785c}.day-note strong{display:block;color:#49684c;margin-bottom:8px}.location-sample{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:18px}.location-sample article{padding:22px;background:#f4f6eb;border:1px solid #e0e5d7;border-radius:17px}.location-sample h3{font:22px Georgia,serif;margin:0 0 8px}.location-sample p{color:#6b7c62;font-size:12px}dialog{padding:0;border:1px solid #dce3d5;border-radius:22px;width:min(840px,calc(100vw - 30px));max-width:840px;max-height:92vh;background:#fffefa;color:#3c5143;box-shadow:0 25px 100px #1838282b}dialog::backdrop{background:#243c324d;backdrop-filter:blur(4px)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 27px;border-bottom:1px solid #e1e6db;gap:16px}.modal-head h2{font:24px Georgia,serif;margin:0}.modal-head button{font-size:21px;line-height:1;border:0;background:transparent}#modalBody{padding:24px 27px;overflow:auto}.modal-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;border-top:1px solid #e2e5da;padding-top:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-grid>div.wide{grid-column:1/-1}.form-grid label{font-size:12px;color:#5a6d59;display:block;margin-bottom:7px}.form-grid input,.form-grid textarea{width:100%;padding:10px;border:1px solid #d9e1d2;border-radius:10px;background:#fffefa}.form-grid textarea{min-height:90px}.form-grid .batch-wide{grid-column:1/-1}#previewStatus{max-width:1340px;margin:14px auto;font-size:12px;color:#55714e;min-height:20px}details#settingsMenu>summary{cursor:pointer;font-size:12px;color:#4e6d50}details#settingsMenu[open]{padding:10px;background:#fffefa;border:1px solid #d9e2cf;border-radius:12px}#settingsMenu .batch-button{display:block;margin-top:8px}
@media(max-width:700px){body{padding:10px}header{padding:20px}header h1{font-size:25px}#view{padding:20px 16px}nav{padding:12px 16px}.hub-grid,.location-sample{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}#modalBody{padding:20px}.modal-head{padding:18px 20px}}
</style>

<body data-motion="calm">
<p class="preview-note">Interactive Batch A example · sample records · resets on reload · no account connection</p>
<div class="shell"><header><div class="mark"><span class="leaf" aria-hidden="true">❧</span><div><small>YOUR WORKHUB · BATCH A</small><h1>A little more room for good work.</h1></div></div><details id="settingsMenu"><summary>Workspace settings</summary></details></header>
<nav aria-label="Example workspace"><button data-demo="nav" data-tab="home">My day</button><button data-demo="nav" data-tab="tasks">Tasks</button><button data-demo="nav" data-tab="knowledge">Knowledge</button><button data-demo="nav" data-tab="schedule">Schedule</button><button data-demo="pause">Pause stopwatch</button><button data-demo="wrap">Stop & wrap up</button></nav><div id="view"></div></div>
<p id="previewStatus" role="status"></p>
<dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button type="button" data-demo="close" aria-label="Close dialog">×</button></div><div id="modalBody"></div></dialog>
<script src="../batch-a-engine.js?v=20261017-batch-a-1"></script>
<script src="../batch-a.js?v=20261017-batch-a-2"></script>
<script>
const E=WorkHubBatchEngine,$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const task=(id,task,done=false)=>({id,task,number:id.slice(-1),done,doneDate:done?'2026-10-15':'',boardStatus:done?'done':'todo',archived:false,archivedAt:'',dueDate:'2026-10-22',priority:'High',taskType:'Project',linkId:'project-1',customLink:'',remarks:'Keep the design decision and test evidence together.',feedback:'Confirm the expected result with the process owner.',subTasks:[]});
let memory={calendarMonth:'2026-10',activeProjectId:'project-1',projects:[{id:'project-1',name:'Northstar rollout'},{id:'project-2',name:'Service improvement'}],tasks:[task('task-1','Configure the approval path'),task('task-2','Verify the posting in QAS'),task('task-3','Share the walkthrough',true)],tickets:[{id:'ticket-1',ticket:'AMS-042',description:'Review the client clarification',status:'Pending',created:'2026-10-01'}],specs:[],schedule:[{date:'2026-10-12',time:'09:00',endTime:'12:00',kind:'project',location:'Office'},{date:'2026-10-13',time:'09:15',endTime:'11:45',kind:'project',location:'Remote'},{date:'2026-10-15',time:'10:00',endTime:'12:00',kind:'project',location:'Client site'},{date:'2026-10-16',time:'09:00',endTime:'10:00',kind:'project',location:'Office'}],workhub:{notes:[{id:'note-1',title:'A calmer way to check a posting',body:'Start with the business expectation, then compare the observed result. Keep the test data, system and client beside the evidence.\n\nWhen an approval or a missing document blocks the next step, record the dependency explicitly. A short wrap-up makes it easier to return without reconstructing the whole investigation.',tcodes:'MIGO · MIRO',projectId:'project-1'}],sessions:[{id:'session-1',kind:'task',linkId:'task-2',completedWork:'Compared the expected and observed posting in QAS.',nextStep:'Confirm the signed design with the process owner.',pauseReason:'approval',pauseNotes:'Owner review is the only remaining prerequisite.'}]}};
E.upgrade(memory);memory.workhub.batchA.labels=[{id:'clarify',name:'Client discussion'},{id:'test',name:'Testing'}];memory.workhub.batchA.glossary=[{id:'term-1',term:'BP',meaning:'Business partner — the shared person or organisation record used in our project.',aliases:'Supplier, customer',context:'Confirm the role and business context before choosing a record.',projectId:'project-1',updatedAt:'2026-10-16T10:00:00Z'},{id:'term-2',term:'GR/IR',meaning:'Goods receipt / invoice receipt clearing. Our shorthand when comparing receipt and invoice postings.',aliases:'Receipt / invoice clearing',context:'Example definition: confirm it against your own process.',projectId:'',updatedAt:'2026-10-16T10:00:00Z'}];
E.patch(memory,'tasks','task-1',{environmentId:'dev',systemId:'S4D',client:'100',labelIds:['clarify'],updatedAt:'2026-10-01T10:00:00Z',dependencies:[{id:'dep-1',type:'task',targetId:'task-2',title:'Verify the posting in QAS',resolved:false},{id:'dep-2',type:'document',targetId:'',title:'Signed design',resolved:false}]});
E.meta(memory,'tasks','task-1').updatedAt='2026-10-01T10:00:00Z';
E.patch(memory,'tasks','task-2',{environmentId:'qas',systemId:'S4Q',client:'200',labelIds:['test'],pause:{reason:'approval',notes:'Waiting for the process owner to sign off.',active:true,at:'2026-10-16T10:00:00Z'},nextStep:'Confirm the signed design with the process owner.',lastSessionId:'session-1'});
E.patch(memory,'tasks','task-3',{environmentId:'prd',systemId:'S4P',client:'300',outcome:'implemented'});
E.patch(memory,'notes','note-1',{labelIds:['test'],environmentId:'qas'});
let page='home',ui,timer=null;
function open(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;ui?.decorateModal();if(!$('modal').open)$('modal').showModal();}
function close(){$('modal').close();}
function mutate(fn){const before=memory,next=E.copy(memory);fn(next);E.prepare(next,before);E.validate(next);memory=next;render();return true;}
function render(){
 document.querySelectorAll('[data-demo="nav"]').forEach(b=>b.classList.toggle('active',b.dataset.tab===page));
 const head=(kicker,title,body)=>'<div class="hub-head"><span class="batch-eyebrow">'+kicker+'</span><h2>'+title+'</h2><p>'+body+'</p></div>';
 if(page==='home')$('view').innerHTML='<section class="hub">'+head('YOUR PERSONAL WORKSPACE','Welcome back. Your thread is right here.','Small next steps, with the context you left yourself.')+'<div class="day-note"><strong>Today has room for one useful thing.</strong>Use Tasks to explore prerequisites, environment badges and splitting. Your glossary and work-location totals are a click away.</div></section>';
 if(page==='tasks')$('view').innerHTML='<section class="hub">'+head('MOVE WORK FORWARD','A clearer path to the next step.','Open Work context on a card to explore its dependencies, notes, pause reason and outcome.')+'<div>'+memory.tasks.filter(t=>ui.matches('tasks',t.id)).map(t=>'<article class="task-main-card"><div class="task-top"><span>NORTHSTAR ROLLOUT · TASK '+esc(t.number)+'</span><span class="tag">'+(t.done?'Completed':'Open')+'</span></div><h3 class="hub-sensitive">'+esc(t.task)+'</h3><p class="hub-sensitive">'+esc(t.remarks)+'</p><div class="actions"><button class="small" data-action="edit" data-group="tasks" data-id="'+esc(t.id)+'">Edit main task</button><button class="small" data-demo="complete" data-id="'+esc(t.id)+'">'+(t.done?'Reopen task':'Complete task')+'</button></div></article>').join('')+'</div></section>';
 if(page==='knowledge')$('view').innerHTML='<section class="hub">'+head('YOUR SAP MM REFERENCE','Keep a little clarity close.','Your personal terms and your reusable notes, together.')+'<div class="hub-grid">'+memory.workhub.notes.filter(n=>ui.matches('notes',n.id)).map(n=>'<article class="hub-card"><span class="batch-eyebrow">KNOWLEDGE NOTE</span><h3>'+esc(n.title)+'</h3><p>'+esc(n.body.slice(0,180))+'…</p><button data-hub="note-view" data-id="'+esc(n.id)+'" data-demo="note">Read note</button></article>').join('')+'</div></section>';
 if(page==='schedule')$('view').innerHTML='<section class="hub">'+head('YOUR TIME, IN VIEW','Office. Client site. Remote.','Location totals use the dates and minutes already booked in Schedule.')+'<div class="location-sample"><article><h3>Office</h3><p>12 & 16 October<br>4 hours booked</p></article><article><h3>Remote</h3><p>13 October<br>2 hours 30 minutes booked</p></article><article><h3>Client site</h3><p>15 October<br>2 hours booked</p></article></div></section>';
 ui?.mount(page);
}
function pause(){if(timer?.runningSince){timer.segments.push({start:timer.runningSince,end:new Date().toISOString()});timer.runningSince=null;}}
function resume(){if(!timer){timer={id:E.uid(),kind:'task',linkId:'task-2',title:'Verify the posting in QAS',started:new Date().toISOString(),runningSince:new Date().toISOString(),segments:[],notes:''};ui.timerStarted(timer);}else if(!timer.runningSince){timer.runningSince=new Date().toISOString();ui.timerResumed(timer);}render();}
ui=WorkHubBatchA.install({state:()=>memory,ready:()=>true,owner:()=>'example-workspace',today:()=>new Date().toLocaleDateString('en-CA'),month:()=>'2026-10',mutate,render,navigate(tab){page=tab;close();render();},openModal:open,closeModal:close,tell:text=>$('previewStatus').textContent=text,latestHistory:r=>r.history||'',timer:()=>timer,pauseTimer:pause,resumeTimer:resume,persistTimer(){},finishTimer(){pause();const session={id:timer.id,title:timer.title,kind:timer.kind,linkId:timer.linkId,seconds:Math.max(1,timer.segments.reduce((n,s)=>n+(Date.parse(s.end)-Date.parse(s.start))/1000,0)),...ui.timerFields(timer)};mutate(d=>{d.workhub.sessions.push(session);E.attachSession(d,session);});timer=null;close();render();$('previewStatus').textContent='Example session and wrap-up saved in memory.';},hubAction(el){if(el.dataset.hub==='timer-new'){if(!timer)resume();else $('previewStatus').textContent='The example stopwatch is already active.';close();}else ui.recordView(el.dataset.hub==='note-view'?'notes':'tasks',el.dataset.id);},ticket:id=>ui.recordView('tickets',id),project:id=>ui.recordView('projects',id),openSubItems:id=>ui.recordView('specs',id)});
document.addEventListener('click',event=>{
 const b=event.target.closest('[data-demo],[data-action="edit"]');if(!b)return;
 if(b.dataset.action==='edit'){const t=E.record(memory,'tasks',b.dataset.id);open('Edit main task','<form id="editForm" data-group="tasks" data-id="'+esc(t.id)+'"><div class="form-grid"><div class="wide"><label>Task<input name="task" maxlength="500" required value="'+esc(t.task)+'"></label></div><div class="wide"><label>Remarks<textarea name="remarks">'+esc(t.remarks)+'</textarea></label></div></div><div class="modal-actions"><button type="button" data-demo="close">Cancel</button><button class="primary" type="submit">Save task</button></div></form>');return;}
 if(b.dataset.demo==='close')close();
 if(b.dataset.demo==='nav'){page=b.dataset.tab;render();}
 if(b.dataset.demo==='complete')mutate(d=>{const t=E.record(d,'tasks',b.dataset.id);t.done=!t.done;t.boardStatus=t.done?'done':'todo';});
 if(b.dataset.demo==='note')ui.recordView('notes',b.dataset.id);
 if(b.dataset.demo==='pause'){if(!timer)resume();ui.pauseTimerPrompt();}
 if(b.dataset.demo==='wrap'){if(!timer)resume();ui.wrapTimerPrompt();}
});
document.addEventListener('submit',event=>{if(event.target.id!=='editForm')return;event.preventDefault();const f=event.target;mutate(d=>{const t=E.record(d,'tasks',f.dataset.id);t.task=f.elements.namedItem('task').value;t.remarks=f.elements.namedItem('remarks').value;ui.capture(d,f,'tasks',t.id);});close();});
render();
</script></body></html>
