<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Audience · Process Hub</title>
    <link rel="stylesheet" href="./audience.css?v=20261025-presenter-3" />
    <script defer src="./audience-view.js?v=20261025-presenter-3"></script>
    <script defer src="./audience.js?v=20261025-presenter-3"></script>
  </head>
  <body class="audience-window">
    <main id="audienceStage" aria-label="Audience presentation"></main>
    <section
      id="audienceFullscreenPrompt"
      class="audience-fullscreen-prompt"
      aria-label="Start audience fullscreen"
      hidden
    >
      <div>
        <strong>Ready for your shared screen</strong>
        <p>Click once to remove the browser frame and fill this display.</p>
      </div>
      <button id="audienceStartFullscreen" type="button">⛶ Start full screen</button>
      <button id="audienceStayWindowed" type="button">Stay windowed</button>
      <span id="audienceFullscreenStatus" role="status"></span>
    </section>
    <nav class="audience-window-controls" aria-label="Window controls">
      <button id="audienceFullscreen" type="button">⛶ Full screen</button
      ><button id="audienceLaser" type="button" aria-pressed="false">● Laser pointer</button
      ><span id="audienceConnection" role="status">Waiting for presenter</span>
    </nav>
  </body>
</html>
