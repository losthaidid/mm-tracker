name: Verify application
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: 'verify-${{ github.ref }}'
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent XLS test reader
        run: python3 -m pip install xlrd==2.0.2
      - run: npm test
